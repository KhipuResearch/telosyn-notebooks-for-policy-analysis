# Notebook release gates — the only blocking notebook CI in this repository.
#
# Replaces notebook-validation.yml (retired to .disabled alongside this commit),
# which called nbformat.read(), printed "Valid structure", and carried
# `continue-on-error: true`. All 53 archived notebooks passed it, including the
# 31 that could not parse — audit finding F-15.
#
# NOTHING IN THIS FILE MAY CARRY `continue-on-error: true`, and no `run` block
# may end in `|| true`. Both neutralise a step, and this repository has both in
# its history: every step in markdown-quality.yml carried them together, so
# removing one changed nothing. If a check here cannot fail, it does not belong
# here — advisory checks live in tutorial-quality.yml, which says so.
name: Notebook Release Gates

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Five pre-existing suites import first-party packages that are not on PyPI
  # (krl_policy, a Fed DFA connector) or optional scientific extras. They are
  # unrelated to the notebook corpus, were last touched at 4bd0ccb, and fail at
  # COLLECTION — which takes the whole run down before any gate executes.
  # Excluded by name rather than silenced, so the exclusion stays visible.
  PRE_EXISTING_EXCLUSIONS: >-
    --ignore=tests/causal_workflow
    --ignore=tests/sowellian_chains
    --ignore=tests/cultural_org_network
    --ignore=tests/test_d02_l15_regression.py
    --ignore=tests/test_d06_l15_regression.py
    --ignore=tests/test_d07_l15_regression.py
    --ignore=tests/test_d18_l15_regression.py
    --ignore=tests/test_d27_l15_regression.py

jobs:
  # ---------------------------------------------------------------- fast lane
  static-gates:
    name: "Lane 1 — static (blocking)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the public-surface check compares the branch with origin/main.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[notebooks,test,econml]'

      - name: All gates — compile, metadata, evidence, secrets, statistics, claims
        env:
          KRL_NOTEBOOK_ROOT: projects
        # `-o addopts=""` is load-bearing. pytest.ini injects
        # `--cov=src --cov-report=... --cov-branch --cov-fail-under=80` into every
        # invocation. Two independent failures follow on a clean runner:
        #   1. pytest-cov is not installed here, so pytest aborts with
        #      "unrecognized arguments" before collecting a single test;
        #   2. even installed, `src/` does not exist in this repository -- the
        #      package is `src/krl_tutorials_data/` -- so coverage measures 0% and
        #      `--cov-fail-under=80` fails the step unconditionally.
        # The `--cov=src` path is a pre-existing defect in pytest.ini, left in
        # place rather than edited here: that file is shared with the legacy
        # suites and changing it changes their behaviour too. The two strict
        # flags that addopts also carried are restored explicitly below, because
        # pytest.ini declares markers and this gate should reject unknown ones.
        run: >-
          pytest tests/ -o addopts="" -v --tb=short
          --strict-markers --strict-config
          ${{ env.PRE_EXISTING_EXCLUSIONS }}

      - name: Public surface — paths, caches, trailers and licence headers (public rules only)
        # CI holds no private name list and no secret, so it runs the public rules only and
        # the check says so in its output. The rules that need the private denylist run
        # locally (`make check` with KRL_SURFACE_DENYLIST set) and refuse to pass without it.
        run: |
          BASE="origin/${GITHUB_BASE_REF:-main}"
          python scripts/check_public_surface.py --public-rules --tree --range "$BASE"

      - name: Secret scan across the surface this repository can change
        run: |
          # Scope and plugin set are both MEASURED, not guessed. Run unscoped,
          # `detect-secrets scan --all-files` returns 334 findings on tracked
          # files. Every one was read. None is a credential. They fall into
          # three classes, and two of them are mandated by other gates in this
          # same file:
          #
          #   51  base64 `image/png` cell outputs  <- required by "notebooks must
          #                                           CARRY their outputs", below
          #   31  sha256 hashes in provenance/*.json <- required by the hash-pin
          #                                           evidence regime
          #  ~30  Plotly `bdata` numeric arrays in stored outputs
          #   22  keyword hits: env-var NAMES in prose, `api_key_env` config keys,
          #       the forbidden-pattern regexes in .gitleaks.toml, and a
          #       zero-entropy lowercase placeholder (`krl_..._test...`) in three
          #       archived diabetes notebooks
          #
          # So the two generic entropy plugins carry no signal in a corpus whose
          # contract is "store your outputs and hash-pin your inputs": measured
          # 82/82 false positives inside projects. They are disabled by name,
          # here, with that measurement stated -- not silenced with a baseline
          # file that would also swallow a genuinely new secret and would thrash
          # on every re-execution as PNG bytes and line numbers move.
          #
          # Every STRUCTURED detector stays on: KeywordDetector, AWSKeyDetector,
          # PrivateKeyDetector, GitHubTokenDetector, StripeDetector and the rest.
          # Those are what catch `api_key = "..."`, and they are the reason this
          # step is blocking.
          #
          # SCOPE: the corpus under projects/ is the scanned surface
          # because it is preserved byte-for-byte by contract. 289 of the 334
          # findings live there, and NONE of them can be cleared without breaking
          # that preservation -- a blocking gate over immutable files can only
          # ever be red or ignored. It is audited above and reported advisorily
          # in tutorial-quality.yml, which says it is advisory.
          #
          # Verified: 0 findings on this scope at the commit that introduced it.
          pip install detect-secrets
          detect-secrets scan --all-files \
            --disable-plugin Base64HighEntropyString \
            --disable-plugin HexHighEntropyString \
            projects src tests scripts data .github \
            > .secrets.new
          python - <<'PY'
          import json, sys
          found = json.load(open(".secrets.new")).get("results", {})
          if found:
              print("Secret-shaped material detected:")
              for path, items in found.items():
                  for item in items:
                      print(f"  {path}:{item.get('line_number')} [{item.get('type')}]")
              sys.exit(1)
          print("No secret-shaped material found.")
          PY

      - name: Committed notebooks must CARRY their outputs
        run: |
          python - <<'PY'
          import json, pathlib, sys

          # The opposite of the usual convention, and deliberate. F-1/F-2 were a
          # corpus of 33 notebooks with no stored outputs and prose describing
          # results that nothing could check. tests/test_gate_evidence.py enforces
          # this per notebook; this step states the repository-wide rule so that a
          # future `nbstripout --install` is caught here rather than silently
          # emptying the evidence.
          silent = []
          for path in sorted(pathlib.Path("projects").rglob("*.ipynb")):
              notebook = json.loads(path.read_text())
              code = [c for c in notebook.get("cells", []) if c.get("cell_type") == "code"]
              if code and not any(c.get("outputs") for c in code):
                  silent.append(str(path))
          if silent:
              print("Notebooks in this corpus must be committed WITH their outputs.")
              print("Do not run nbstripout here. Silent notebooks:")
              print("\n".join(f"  {s}" for s in silent))
              sys.exit(1)
          print("Every notebook carries stored output.")
          PY

  # There is no second lane. Re-executing the notebooks against live sources needs
  # API keys, and this repository stores and uses no secrets (owner rule, 2026-10-16).
  # A reader re-executes them with their own keys; see docs/reproducibility.md. What
  # CI can establish without a key -- stored outputs, provenance digests, gates -- is
  # established in the lane above.
