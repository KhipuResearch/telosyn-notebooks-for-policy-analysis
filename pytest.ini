[pytest]
pythonpath = src
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --verbose
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-branch
    # Ratchet: raised from 77 to 84 at the close of Timebox 0 (2026-10-16), when the
    # suite measured 84.71% (branch coverage over src/). The 77 was declared while
    # --cov=src pointed at a directory that did not exist, so it had never been
    # measured; its first real measurement (2026-10-15) was 77.76%, the gap being the
    # fail-closed error branches of the fetchers in sources.py. A floor above where
    # you are is not a floor, so this is the integer below the measurement. Raise it,
    # and FLOOR_AT_TB0 in tests/test_ci_history_and_surface.py, after each timebox;
    # never lower either.
    --cov-fail-under=84
    --tb=short
    --durations=10

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    api: marks tests that require API credentials
    network: marks tests that require network access

# Coverage
[coverage:run]
source = src
branch = True
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */conftest.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
