[pytest]
pythonpath = src
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --verbose
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-branch
    # 77, not 80. The 80 was declared while --cov=src pointed at a directory
    # that did not exist, so it had never been measured against anything; the
    # first real measurement (2026-10-15, after the src-layout move) was 77.76%.
    # A floor above where you are is not a floor. The gap is the error branches
    # of the fetchers in sources.py -- jam values, bad status, missing columns --
    # whose happy paths have fixtures and whose fail-closed paths largely do not.
    # Raise this as those tests land; never lower it.
    --cov-fail-under=77
    --tb=short
    --durations=10

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    api: marks tests that require API credentials
    network: marks tests that require network access

# Coverage
[coverage:run]
source = src
branch = True
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */conftest.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
