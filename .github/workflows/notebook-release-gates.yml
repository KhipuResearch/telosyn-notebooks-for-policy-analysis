# Notebook release gates — the only blocking notebook CI in this repository.
#
# Replaces notebook-validation.yml (retired to .disabled alongside this commit),
# which called nbformat.read(), printed "Valid structure", and carried
# `continue-on-error: true`. All 53 archived notebooks passed it, including the
# 31 that could not parse — audit finding F-15.
#
# NOTHING IN THIS FILE MAY CARRY `continue-on-error: true`, and no `run` block
# may end in `|| true`. Both neutralise a step, and this repository has both in
# its history: every step in markdown-quality.yml carried them together, so
# removing one changed nothing. If a check here cannot fail, it does not belong
# here — advisory checks live in tutorial-quality.yml, which says so.
name: Notebook Release Gates

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Five pre-existing suites import first-party packages that are not on PyPI
  # (krl_policy, a Fed DFA connector) or optional scientific extras. They are
  # unrelated to the notebook corpus, were last touched at 4bd0ccb, and fail at
  # COLLECTION — which takes the whole run down before any gate executes.
  # Excluded by name rather than silenced, so the exclusion stays visible.
  PRE_EXISTING_EXCLUSIONS: >-
    --ignore=tests/causal_workflow
    --ignore=tests/sowellian_chains
    --ignore=tests/cultural_org_network
    --ignore=tests/test_d02_l15_regression.py
    --ignore=tests/test_d06_l15_regression.py
    --ignore=tests/test_d07_l15_regression.py
    --ignore=tests/test_d18_l15_regression.py
    --ignore=tests/test_d27_l15_regression.py

jobs:
  # ---------------------------------------------------------------- fast lane
  static-gates:
    name: "Lane 1 — static (blocking)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the public-surface check compares the branch with origin/main.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[notebooks,test]'

      - name: All gates — compile, metadata, evidence, secrets, statistics, claims
        env:
          KRL_NOTEBOOK_ROOT: projects
        # `-o addopts=""` is load-bearing. pytest.ini injects
        # `--cov=src --cov-report=... --cov-branch --cov-fail-under=80` into every
        # invocation. Two independent failures follow on a clean runner:
        #   1. pytest-cov is not installed here, so pytest aborts with
        #      "unrecognized arguments" before collecting a single test;
        #   2. even installed, `src/` does not exist in this repository -- the
        #      package is `src/krl_tutorials_data/` -- so coverage measures 0% and
        #      `--cov-fail-under=80` fails the step unconditionally.
        # The `--cov=src` path is a pre-existing defect in pytest.ini, left in
        # place rather than edited here: that file is shared with the legacy
        # suites and changing it changes their behaviour too. The two strict
        # flags that addopts also carried are restored explicitly below, because
        # pytest.ini declares markers and this gate should reject unknown ones.
        run: >-
          pytest tests/ -o addopts="" -v --tb=short
          --strict-markers --strict-config
          ${{ env.PRE_EXISTING_EXCLUSIONS }}

      - name: Public surface — names, paths, trailers, caches and licence headers
        env:
          # The name patterns are private; the check refuses to run without them (exit 2).
          # Add the repository secret KRL_SURFACE_DENYLIST_JSON (the denylist file's content).
          KRL_SURFACE_DENYLIST_JSON: ${{ secrets.KRL_SURFACE_DENYLIST_JSON }}
        run: |
          umask 077
          printf '%s' "$KRL_SURFACE_DENYLIST_JSON" > "$RUNNER_TEMP/surface_denylist.json"
          BASE="origin/${GITHUB_BASE_REF:-main}"
          KRL_SURFACE_DENYLIST="$RUNNER_TEMP/surface_denylist.json" \
            python scripts/check_public_surface.py --tree --range "$BASE"

      - name: Secret scan across the surface this repository can change
        run: |
          # Scope and plugin set are both MEASURED, not guessed. Run unscoped,
          # `detect-secrets scan --all-files` returns 334 findings on tracked
          # files. Every one was read. None is a credential. They fall into
          # three classes, and two of them are mandated by other gates in this
          # same file:
          #
          #   51  base64 `image/png` cell outputs  <- required by "notebooks must
          #                                           CARRY their outputs", below
          #   31  sha256 hashes in provenance/*.json <- required by the hash-pin
          #                                           evidence regime
          #  ~30  Plotly `bdata` numeric arrays in stored outputs
          #   22  keyword hits: env-var NAMES in prose, `api_key_env` config keys,
          #       the forbidden-pattern regexes in .gitleaks.toml, and a
          #       zero-entropy lowercase placeholder (`krl_..._test...`) in three
          #       archived diabetes notebooks
          #
          # So the two generic entropy plugins carry no signal in a corpus whose
          # contract is "store your outputs and hash-pin your inputs": measured
          # 82/82 false positives inside projects. They are disabled by name,
          # here, with that measurement stated -- not silenced with a baseline
          # file that would also swallow a genuinely new secret and would thrash
          # on every re-execution as PNG bytes and line numbers move.
          #
          # Every STRUCTURED detector stays on: KeywordDetector, AWSKeyDetector,
          # PrivateKeyDetector, GitHubTokenDetector, StripeDetector and the rest.
          # Those are what catch `api_key = "..."`, and they are the reason this
          # step is blocking.
          #
          # SCOPE: the corpus under projects/ is the scanned surface
          # because it is preserved byte-for-byte by contract. 289 of the 334
          # findings live there, and NONE of them can be cleared without breaking
          # that preservation -- a blocking gate over immutable files can only
          # ever be red or ignored. It is audited above and reported advisorily
          # in tutorial-quality.yml, which says it is advisory.
          #
          # Verified: 0 findings on this scope at the commit that introduced it.
          pip install detect-secrets
          detect-secrets scan --all-files \
            --disable-plugin Base64HighEntropyString \
            --disable-plugin HexHighEntropyString \
            projects src tests scripts data .github \
            > .secrets.new
          python - <<'PY'
          import json, sys
          found = json.load(open(".secrets.new")).get("results", {})
          if found:
              print("Secret-shaped material detected:")
              for path, items in found.items():
                  for item in items:
                      print(f"  {path}:{item.get('line_number')} [{item.get('type')}]")
              sys.exit(1)
          print("No secret-shaped material found.")
          PY

      - name: Committed notebooks must CARRY their outputs
        run: |
          python - <<'PY'
          import json, pathlib, sys

          # The opposite of the usual convention, and deliberate. F-1/F-2 were a
          # corpus of 33 notebooks with no stored outputs and prose describing
          # results that nothing could check. tests/test_gate_evidence.py enforces
          # this per notebook; this step states the repository-wide rule so that a
          # future `nbstripout --install` is caught here rather than silently
          # emptying the evidence.
          silent = []
          for path in sorted(pathlib.Path("projects").rglob("*.ipynb")):
              notebook = json.loads(path.read_text())
              code = [c for c in notebook.get("cells", []) if c.get("cell_type") == "code"]
              if code and not any(c.get("outputs") for c in code):
                  silent.append(str(path))
          if silent:
              print("Notebooks in this corpus must be committed WITH their outputs.")
              print("Do not run nbstripout here. Silent notebooks:")
              print("\n".join(f"  {s}" for s in silent))
              sys.exit(1)
          print("Every notebook carries stored output.")
          PY

  # ---------------------------------------------------------------- slow lane
  #
  # The `notebook-release` environment now exists on this repository and holds
  # CENSUS_API_KEY, FRED_API_KEY, BLS_API_KEY and HUD_API_KEY, so the original
  # precondition for the label is met. The label is retained as a DELIBERATE
  # choice, not a leftover, for one reason: this repository is private, so
  # GitHub offers it no environment protection rules -- no required reviewer, no
  # wait timer. The environment therefore scopes the four keys to this job and
  # nothing else, which is real, but it does not gate their use behind a human.
  # Until that is settled, spending live API budget stays opt-in per pull
  # request. See the three options recorded alongside the environment.
  execution-gate:
    name: "Lane 2 — execution against real data (blocking when run)"
    needs: static-gates
    if: contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    environment: notebook-release
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the public-surface check compares the branch with origin/main.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[notebooks,test]'

      - name: Restart & Run All against live sources
        env:
          # Every credential any notebook in projects needs. The list sat at
          # four while the corpus grew past it: D11 needs BEA and D13/D26 need
          # DATA_GOV, and all three fail closed, so this job was failing three
          # notebooks for want of two secrets rather than for any defect in them.
          # tests/test_ci_credentials.py now fails when a notebook needs a key
          # this block does not supply.
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          HUD_API_KEY: ${{ secrets.HUD_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys, nbformat
          from nbclient import NotebookClient
          from nbclient.exceptions import CellExecutionError

          # Notebooks that CANNOT run here, with the reason, enforced in both
          # directions below. Zillow publishes ZHVI as a download and its terms do
          # not permit redistribution, so `data/zillow/**/*.csv` is gitignored
          # (unlike the HUD bulk files, which are US Government works in the public
          # domain and ARE committed -- both HUD notebooks pass here). A clean
          # checkout therefore cannot satisfy this notebook's pinned input, and no
          # amount of fixing changes that. Recording it as a declared exception is
          # honest; letting it fail the gate forever would train everyone to ignore
          # a red run, which is the exact defect this workflow replaced.
          LICENSE_RESTRICTED = {
              "projects/08-culture-society/D27_housing_affordability_and_gentrification/D27_gentrification.ipynb":
                  "Zillow ZHVI county file is gitignored -- terms forbid redistribution",
          }

          notebooks = sorted(pathlib.Path("projects").rglob("*.ipynb"))
          known = {str(n) for n in notebooks}
          stale = sorted(set(LICENSE_RESTRICTED) - known)
          if stale:
              print("LICENSE_RESTRICTED names notebooks that do not exist:")
              print("\n".join(f"  {s}" for s in stale))
              sys.exit(1)

          failures: list[str] = []
          skipped: list[str] = []
          leaks: list[str] = []

          for path in notebooks:
              notebook = nbformat.read(path, as_version=4)
              for cell in notebook.cells:
                  if cell.cell_type == "code":
                      cell.outputs, cell.execution_count = [], None
              try:
                  # cwd is the repository root: notebooks resolve pinned bulk files
                  # by repo-relative path (data/hud/..., data/zillow/...).
                  NotebookClient(
                      notebook, timeout=900, kernel_name="python3",
                      resources={"metadata": {"path": "."}},
                  ).execute()
                  print(f"PASS {path}")
              except CellExecutionError as exc:
                  # A BulkFilePinError means a precondition was not met, which is
                  # categorically different from a notebook that is wrong. It is
                  # tolerated ONLY for a notebook declared above; anywhere else a
                  # missing pinned file is a real failure and stays one.
                  pinned = "BulkFilePinError" in str(exc)
                  if pinned and str(path) in LICENSE_RESTRICTED:
                      skipped.append(f"{path}: {LICENSE_RESTRICTED[str(path)]}")
                      print(f"SKIP {path}  (declared: input cannot be committed)")
                  else:
                      failures.append(f"{path}: {exc}")
                      print(f"FAIL {path}")

              # Run this on EVERY notebook, passed or failed. The previous version
              # skipped failed ones -- precisely backwards. The FRED key that leaked
              # in this project leaked through a traceback printing a request URL
              # with `api_key=` still in the query string, so a failed notebook's
              # partial outputs are the HIGHEST-risk place for a key to appear, not
              # a place to stop looking. nbclient populates cell outputs as it goes,
              # so the traceback is present on the object even after the raise.
              # Values, never names: the names are public.
              # `.strip()` and the length floor are both load-bearing, and each
              # closes a failure in a different direction. A secret pasted with a
              # trailing newline is stored as "abc123\n"; the key as it actually
              # appears in an output has no newline, so an unstripped comparison
              # MISSES the leak -- the dangerous direction. And a secret that is
              # empty or whitespace-only is truthy enough to pass `if value` while
              # `" " in blob` is true of essentially any JSON, so every notebook
              # would be reported as leaking -- a false rotation event, the noisy
              # direction. Nothing shorter than 8 characters is a credential.
              live = {}
              for name in ("CENSUS_API_KEY", "FRED_API_KEY", "BLS_API_KEY", "HUD_API_KEY"):
                  value = os.environ.get(name, "").strip()
                  if len(value) >= 8:
                      live[name] = value
              blob = json.dumps(notebook, default=str)
              for name, value in live.items():
                  if value in blob:
                      leaks.append(f"{path}: {name} appears in an executed output")

          if skipped:
              print("\nDeclared skips (input cannot be committed to this repository):")
              print("\n".join(f"  {s}" for s in skipped))

          # Leaks are reported before failures and exit on their own: a leak is a
          # rotation event, and it must not be buried under an execution error.
          if leaks:
              print("\nCREDENTIAL LEAK -- rotate the named key before merging:")
              print("\n".join(f"  {leak}" for leak in leaks))
              sys.exit(1)
          if failures:
              print("\nNotebooks that did not complete a clean run:")
              print("\n".join(f"  {f}" for f in failures))
              sys.exit(1)
          print(f"\n{len(notebooks) - len(skipped)} notebooks executed clean against live sources; "
                f"{len(skipped)} declared skip(s); no credential reached an output.")
          PY

      - name: No synthetic data reached a reported figure
        env:
          KRL_NOTEBOOK_ROOT: projects
        # Same pytest.ini coverage override as the static lane; see the comment
        # on that step for why it is required rather than cosmetic.
        run: pytest tests/test_gate_no_synthetic.py -o addopts="" -v --strict-markers
